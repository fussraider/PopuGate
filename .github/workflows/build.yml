name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Least-privilege default for all jobs (only checkout/read is needed here).
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'

      - name: Check swagger docs are up-to-date
        run: |
          go install github.com/swaggo/swag/cmd/swag@v1.16.4
          swag init -g cmd/popugate/server.go -o docs/ --parseInternal
          git diff --exit-code docs/ || (echo "::error::Swagger docs are stale. Run 'make swag' and commit the changes." && exit 1)

      - name: Run tests
        run: go test ./... -v

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          VERSION=$(git rev-parse --short HEAD)
          COMMIT=$(git rev-parse HEAD)
          go build -ldflags "-s -w -X main.version=${VERSION} -X main.commit=${COMMIT}" -o bin/popugate-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/popugate/

      - uses: actions/upload-artifact@v7
        with:
          name: popugate-${{ matrix.goos }}-${{ matrix.goarch }}
          path: bin/popugate-${{ matrix.goos }}-${{ matrix.goarch }}

  # Reachability-aware Go vulnerability scan (official golang.org/x/vuln). Only
  # flags advisories whose vulnerable symbols are actually reached. Known,
  # documented-non-exploitable advisories with no upstream fix are allowlisted
  # from osv-scanner.toml (single source of truth); anything else fails the job.
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      # Same script as `make vulncheck`: distinguishes findings (exit 3, then
      # diffed against the allowlist) from tool failures (any other non-zero,
      # which fails the job instead of passing on an empty report).
      - name: Run govulncheck
        run: ./scripts/vulncheck.sh

  # Version-based scan across all manifests, incl. the frontend (web/pnpm-lock.yaml).
  # Honors osv-scanner.toml, so the same documented suppressions apply here too.
  osv-scanner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'

      # Pinned: the osv-scanner CLI has broken compatibility before (v1 -> v2
      # renamed the scan subcommands). Vulnerability data is fetched live from
      # osv.dev at scan time, so pinning the binary does not stale the results.
      # Bump deliberately after verifying the CLI locally.
      - name: Install osv-scanner
        run: go install github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.4.0

      - name: Run osv-scanner
        run: osv-scanner scan source --config=osv-scanner.toml -r .
