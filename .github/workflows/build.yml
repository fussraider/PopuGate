name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - name: Check swagger docs are up-to-date
        run: |
          go install github.com/swaggo/swag/cmd/swag@v1.16.4
          swag init -g cmd/popugate/server.go -o docs/ --parseInternal
          git diff --exit-code docs/ || (echo "::error::Swagger docs are stale. Run 'make swag' and commit the changes." && exit 1)

      - name: Run tests
        run: go test ./... -v

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          VERSION=$(git rev-parse --short HEAD)
          COMMIT=$(git rev-parse HEAD)
          go build -ldflags "-s -w -X main.version=${VERSION} -X main.commit=${COMMIT}" -o bin/popugate-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/popugate/

      - uses: actions/upload-artifact@v7
        with:
          name: popugate-${{ matrix.goos }}-${{ matrix.goarch }}
          path: bin/popugate-${{ matrix.goos }}-${{ matrix.goarch }}
