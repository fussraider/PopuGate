services:
  popugate-backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/fussraider/popugate:latest
    container_name: popugate-backend
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
    volumes:
      - ./data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-changeme}
      - POPUGATE_DATA_DIR=/data
      - TZ=Europe/Moscow

  popugate-web:
    build:
      context: ./web
      dockerfile: Dockerfile
    image: ghcr.io/fussraider/popugate-web:latest
    container_name: popugate-web
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "80:80"
      - "8443:8443"
    environment:
      - DOMAIN_NAME=${DOMAIN_NAME:-localhost}
      - BACKEND_URL=http://host.docker.internal:8090/api/
    volumes:
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - popugate-backend

  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
