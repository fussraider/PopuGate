basePath: /api/v1
definitions:
  handler.SysctlRequest:
    properties:
      enabled:
        type: boolean
    type: object
  handler.addInstanceRequest:
    properties:
      client_mss_bulk:
        maximum: 4096
        minimum: 88
        type: integer
      fake_tls:
        description: pointer to distinguish unset from false
        type: boolean
      label:
        maxLength: 32
        type: string
      mask_host:
        type: string
      mask_port:
        maximum: 65535
        minimum: 1
        type: integer
      metrics_port:
        maximum: 65535
        minimum: 1
        type: integer
      port:
        maximum: 65535
        minimum: 1
        type: integer
      tags:
        description: JSON array
        type: string
      tcp_mss:
        maximum: 4096
        minimum: 88
        type: integer
      tcp_mss_enabled:
        type: boolean
      tls_domain:
        type: string
      tls_domains:
        description: JSON array
        type: string
      tls_fronting:
        type: boolean
      unknown_sni_action:
        description: drop|mask|accept|reject_handshake (default mask)
        enum:
        - drop
        - mask
        - accept
        - reject_handshake
        type: string
    required:
    - port
    - tls_domain
    type: object
  handler.addSecretRequest:
    properties:
      label:
        maxLength: 32
        type: string
      secret:
        type: string
    required:
    - label
    type: object
  handler.addUpstreamRequest:
    properties:
      address:
        type: string
      iface:
        type: string
      name:
        maxLength: 32
        type: string
      password:
        type: string
      type:
        enum:
        - direct
        - socks5
        - socks4
        - shadowsocks
        type: string
      url:
        type: string
      username:
        type: string
      weight:
        maximum: 100
        minimum: 1
        type: integer
    required:
    - name
    - type
    type: object
  handler.applyTemplateRequest:
    properties:
      secret_label:
        type: string
    required:
    - secret_label
    type: object
  handler.bulkAddRequest:
    properties:
      upstreams:
        items:
          $ref: '#/definitions/handler.bulkAddRequestItem'
        maxItems: 100
        minItems: 1
        type: array
    required:
    - upstreams
    type: object
  handler.bulkAddRequestItem:
    properties:
      address:
        type: string
      iface:
        type: string
      password:
        type: string
      type:
        enum:
        - direct
        - socks5
        - socks4
        - shadowsocks
        type: string
      url:
        type: string
      username:
        type: string
      weight:
        maximum: 100
        minimum: 1
        type: integer
    required:
    - type
    type: object
  handler.bulkCheckRequest:
    properties:
      proxies:
        items:
          type: string
        maxItems: 100
        minItems: 1
        type: array
    required:
    - proxies
    type: object
  handler.bulkExtendRequest:
    properties:
      days:
        minimum: 1
        type: integer
      labels:
        items:
          type: string
        minItems: 1
        type: array
      tag:
        type: string
    required:
    - days
    type: object
  handler.bulkRotateRequest:
    properties:
      labels:
        items:
          type: string
        minItems: 1
        type: array
      tag:
        type: string
    type: object
  handler.bulkSetLimitsRequest:
    properties:
      expires_at:
        type: string
      labels:
        items:
          type: string
        minItems: 1
        type: array
      max_conns:
        type: integer
      max_ips:
        type: integer
      quota_bytes:
        type: integer
      rate_limit_down_bps:
        type: integer
      rate_limit_up_bps:
        type: integer
      tag:
        type: string
    type: object
  handler.bulkToggleRequest:
    properties:
      enable:
        type: boolean
      labels:
        items:
          type: string
        minItems: 1
        type: array
      tag:
        type: string
    type: object
  handler.cloneSecretRequest:
    properties:
      new_label:
        maxLength: 32
        type: string
    required:
    - new_label
    type: object
  handler.createTemplateRequest:
    properties:
      expires_days:
        type: integer
      max_conns:
        type: integer
      max_ips:
        type: integer
      name:
        maxLength: 64
        type: string
      notes:
        maxLength: 500
        type: string
      quota_bytes:
        type: integer
      tags:
        type: string
    required:
    - name
    type: object
  handler.extendSecretRequest:
    properties:
      days:
        minimum: 1
        type: integer
    required:
    - days
    type: object
  handler.importSecretEntry:
    properties:
      label:
        type: string
      secret_key:
        type: string
    required:
    - label
    type: object
  handler.importSecretsRequest:
    properties:
      secrets:
        items:
          $ref: '#/definitions/handler.importSecretEntry'
        minItems: 1
        type: array
    required:
    - secrets
    type: object
  handler.loginRequest:
    properties:
      password:
        type: string
      username:
        type: string
    required:
    - password
    type: object
  handler.loginResponse:
    properties:
      access_token:
        type: string
      expires_in:
        type: integer
      refresh_token:
        type: string
    type: object
  handler.netIface:
    properties:
      addresses:
        items:
          type: string
        type: array
      name:
        type: string
    type: object
  handler.passwordRequest:
    properties:
      current:
        type: string
      new:
        minLength: 8
        type: string
    required:
    - current
    - new
    type: object
  handler.refreshRequest:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  handler.renameSecretRequest:
    properties:
      new_label:
        maxLength: 32
        type: string
    required:
    - new_label
    type: object
  handler.secretToggleRequest:
    properties:
      enabled:
        type: boolean
    required:
    - enabled
    type: object
  handler.setLimitsRequest:
    properties:
      expires_at:
        description: ISO 8601 or "0"
        type: string
      max_conns:
        minimum: -1
        type: integer
      max_ips:
        minimum: -1
        type: integer
      quota:
        description: 'Human-readable: "5G", "500M"'
        type: string
      quota_bytes:
        description: Or raw bytes
        minimum: -1
        type: integer
      rate_limit_down_bps:
        minimum: -1
        type: integer
      rate_limit_up_bps:
        description: Per-user rate limits in bits per second (0 = unlimited, omitted
          = unchanged).
        minimum: -1
        type: integer
    type: object
  handler.setTagsRequest:
    properties:
      tags:
        maxLength: 500
        type: string
    type: object
  handler.setupRequest:
    properties:
      password:
        minLength: 8
        type: string
    required:
    - password
    type: object
  handler.testUpstreamRequest:
    properties:
      address:
        type: string
      iface:
        type: string
      password:
        type: string
      type:
        enum:
        - direct
        - socks5
        - socks4
        - shadowsocks
        type: string
      url:
        type: string
      username:
        type: string
    required:
    - type
    type: object
  handler.updateInstanceRequest:
    properties:
      client_mss_bulk:
        maximum: 4096
        minimum: 88
        type: integer
      enabled:
        type: boolean
      fake_tls:
        type: boolean
      label:
        maxLength: 32
        type: string
      mask_host:
        type: string
      mask_port:
        maximum: 65535
        minimum: 1
        type: integer
      metrics_port:
        maximum: 65535
        type: integer
      port:
        maximum: 65535
        minimum: 1
        type: integer
      tags:
        type: string
      tcp_mss:
        maximum: 4096
        minimum: 88
        type: integer
      tcp_mss_enabled:
        type: boolean
      tls_domain:
        type: string
      tls_domains:
        type: string
      tls_fronting:
        type: boolean
      unknown_sni_action:
        enum:
        - drop
        - mask
        - accept
        - reject_handshake
        type: string
    type: object
  handler.updateNotesRequest:
    properties:
      notes:
        maxLength: 500
        type: string
    type: object
  handler.updateUpstreamRequest:
    properties:
      address:
        type: string
      iface:
        type: string
      password:
        type: string
      type:
        enum:
        - direct
        - socks5
        - socks4
        - shadowsocks
        type: string
      url:
        type: string
      username:
        type: string
      weight:
        maximum: 100
        minimum: 1
        type: integer
    required:
    - type
    type: object
  handler.upstreamToggleRequest:
    properties:
      enabled:
        type: boolean
    required:
    - enabled
    type: object
  model.SystemResources:
    properties:
      cpu_usage:
        description: percent (0-100)
        type: number
      disk_total:
        description: bytes
        type: integer
      disk_used:
        description: bytes
        type: integer
      load1:
        type: number
      load5:
        type: number
      load15:
        type: number
      memory_total:
        description: bytes
        type: integer
      memory_used:
        description: bytes
        type: integer
      uptime:
        description: seconds
        type: integer
    type: object
  service.DockerUpdateStatus:
    properties:
      changelog_url:
        type: string
      current_version:
        type: string
      last_checked:
        type: string
      latest_version:
        type: string
      live_restore_enabled:
        type: boolean
      supported:
        type: boolean
      update_available:
        type: boolean
      updating:
        type: boolean
    type: object
host: localhost:8090
info:
  contact:
    name: PopuGate Support
    url: https://github.com/fussraider/PopuGate
  description: PopuGate is a Telegram MTProto proxy manager with a REST API.
  license:
    name: MIT
    url: https://github.com/fussraider/PopuGate/blob/main/LICENSE
  title: PopuGate API
  version: "1.0"
paths:
  /audit:
    get:
      description: Retrieve audit log entries with pagination and filtering
      parameters:
      - description: Max entries (1-1000, default 100)
        in: query
        name: limit
        type: integer
      - description: Offset (default 0)
        in: query
        name: offset
        type: integer
      - description: Comma-separated list of usernames to filter by
        in: query
        name: users
        type: string
      - description: Comma-separated list of actions to filter by
        in: query
        name: actions
        type: string
      - description: From Unix timestamp (inclusive)
        in: query
        name: from
        type: integer
      - description: To Unix timestamp (inclusive)
        in: query
        name: to
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              type: object
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List audit entries
      tags:
      - audit
  /audit/filters:
    get:
      description: Retrieve a list of unique users and actions present in the logs
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get audit filters list
      tags:
      - audit
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate with username and password to obtain an access/refresh
        token pair
      parameters:
      - description: Login credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.loginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.loginResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Login
      tags:
      - auth
  /auth/logout:
    post:
      consumes:
      - application/json
      description: Revoke the current access token and optionally a refresh token
        from the body
      parameters:
      - description: Refresh token to revoke
        in: body
        name: body
        schema:
          $ref: '#/definitions/handler.refreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Logout
      tags:
      - auth
  /auth/password:
    put:
      consumes:
      - application/json
      description: Update the admin password by providing the current and new password
      parameters:
      - description: Current and new password
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.passwordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Change password
      tags:
      - auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: Exchange a valid refresh token for a new access/refresh token pair
      parameters:
      - description: Refresh token
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.refreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.loginResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Refresh token
      tags:
      - auth
  /auth/setup:
    post:
      consumes:
      - application/json
      description: One-time setup to create the admin password. Returns a token pair
        on success.
      parameters:
      - description: Setup password
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.setupRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.loginResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Initial setup
      tags:
      - auth
  /backups:
    get:
      description: Returns a list of all available backups and whether backup encryption
        is enabled.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List backups
      tags:
      - backup
    post:
      description: Creates a new encrypted or unencrypted backup depending on BACKUP_ENCRYPTION_KEY
        env var. Returns filename, size, checksum, and creation timestamp.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create backup
      tags:
      - backup
  /backups/{filename}:
    delete:
      description: Deletes a backup file and its checksum sidecar by filename
      parameters:
      - description: Backup filename
        in: path
        name: filename
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Delete backup
      tags:
      - backup
  /backups/download/{filename}:
    get:
      description: Downloads a backup file (encrypted or plain) by filename as a binary
        attachment
      parameters:
      - description: Backup filename
        in: path
        name: filename
        required: true
        type: string
      produces:
      - application/octet-stream
      responses:
        "200":
          description: OK
          schema:
            type: file
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Download backup
      tags:
      - backup
  /backups/restore:
    post:
      consumes:
      - application/json
      description: Stops the proxy engine, restores database and config from backup,
        rotates JWT secret, then restarts the engine. Verifies SHA256 checksum if
        available.
      parameters:
      - description: Backup filename to restore
        in: body
        name: body
        required: true
        schema:
          properties:
            filename:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Restore backup
      tags:
      - backup
  /bot/commands:
    post:
      description: Registers the current command list with Telegram via setMyCommands
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update bot commands
      tags:
      - bot
  /bot/detect-chat-id:
    get:
      consumes:
      - application/json
      description: Queries Telegram API for recent messages to detect and auto-save
        the chat ID
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Detect Telegram chat ID
      tags:
      - bot
  /bot/setup:
    post:
      consumes:
      - application/json
      description: Configures and starts the Telegram notification bot with the provided
        token, chat ID, interval, and label
      parameters:
      - description: Bot configuration
        in: body
        name: body
        required: true
        schema:
          properties:
            chat_id:
              type: string
            interval:
              type: integer
            label:
              type: string
            token:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Setup Telegram bot
      tags:
      - bot
  /bot/status:
    get:
      consumes:
      - application/json
      description: Returns the current Telegram bot status including enabled state,
        running state, and configuration
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Bot status
      tags:
      - bot
  /bot/test:
    post:
      consumes:
      - application/json
      description: Sends a test message via the configured Telegram bot
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Test bot notification
      tags:
      - bot
  /bot/toggle:
    put:
      consumes:
      - application/json
      description: Enables or disables the Telegram notification bot
      parameters:
      - description: Enable flag
        in: body
        name: body
        required: true
        schema:
          properties:
            enable:
              type: boolean
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Toggle bot on/off
      tags:
      - bot
  /config:
    get:
      consumes:
      - application/json
      description: Returns all application settings
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get all settings
      tags:
      - config
    put:
      consumes:
      - application/json
      description: Updates application settings. Only whitelisted keys are accepted;
        internal keys (jwt_secret, auth_password_hash) are rejected.
      parameters:
      - description: Settings key-value pairs to update
        in: body
        name: body
        required: true
        schema:
          additionalProperties: true
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update settings
      tags:
      - config
  /config/{key}:
    get:
      consumes:
      - application/json
      description: Returns the value of a specific setting by key name
      parameters:
      - description: Setting key
